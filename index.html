<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>furkan bozdag</title>
  <meta name="description" content="software crafter, coffee addict and part-time gamer. building at delivery hero in berlin, germany." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0C0D11;
      --text: #C5C8D6;
      --dim: #4A4F66;
      --bright: #E6E8F0;
      --accent: #7B82F6;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F7F8FC;
        --text: #404258;
        --dim: #A0A4BE;
        --bright: #1A1C2E;
        --accent: #4F57E8;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      width: 100%;
      max-width: 480px;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--bright);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.1em;
      background: var(--accent);
      margin-left: 3px;
      vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }

    .name .sep { color: var(--dim); }

    @keyframes blink { 50% { opacity: 0; } }

    .theme-btn {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      background: none;
      border: 1px solid var(--dim);
      color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .theme-btn:hover { color: var(--accent); border-color: var(--accent); }

    .bio {
      font-size: 13px;
      font-weight: 300;
      line-height: 1.9;
      color: var(--text);
      margin-bottom: 2.5rem;
    }

    .bio .muted { color: var(--dim); }
    .bio .hi { color: var(--accent); font-weight: bold; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .links a {
      text-decoration: none;
      font-size: 12px;
      color: var(--dim);
      border: 1px solid var(--dim);
      padding: 4px 12px;
      border-radius: 4px;
      transition: color 0.15s, border-color 0.15s;
    }

    .links a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">// dark</button>
<main>
  <h1 class="name">furkan bozdag<span class="sep"> · </span>𐱅𐰼𐰇𐰰<span class="cursor"></span></h1>
  <p class="bio">
    software crafter, coffee addict, part-time gamer.<br>
    building at <span class="hi">delivery hero</span> in berlin, germany.
  </p>
  <nav class="links">
    <a href="https://linkedin.com/in/bozd4g" target="_blank" rel="noopener">linkedin</a>
    <a href="https://github.com/bozd4g" target="_blank" rel="noopener">github</a>
    <a href="https://x.com/bozd4g" target="_blank" rel="noopener">x</a>
    <a href="https://instagram.com/bozd4g" target="_blank" rel="noopener">instagram</a>
    <a href="mailto:me@furkanbozdag.com">email</a>
  </nav>
</main>
<script>
  const root = document.documentElement;
  const btn = document.getElementById('themeBtn');
  let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  function apply() {
    if (dark) {
      root.style.setProperty('--bg','#0C0D11'); root.style.setProperty('--text','#C5C8D6');
      root.style.setProperty('--dim','#4A4F66'); root.style.setProperty('--bright','#E6E8F0');
      root.style.setProperty('--accent','#7B82F6'); btn.textContent = '// light';
    } else {
      root.style.setProperty('--bg','#F7F8FC'); root.style.setProperty('--text','#404258');
      root.style.setProperty('--dim','#A0A4BE'); root.style.setProperty('--bright','#1A1C2E');
      root.style.setProperty('--accent','#4F57E8'); btn.textContent = '// dark';
    }
  }
  function toggleTheme() { dark = !dark; apply(); }
  apply();
</script>
</body>
</html>
