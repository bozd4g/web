  <!-- apply saved theme before first paint -->
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>

  <style>
    @layer reset, base, components;

    @layer reset {
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button { font: inherit; color: inherit; }
    }

    @layer base {
      :root {
        color-scheme: light dark;

        /* graphite + berlin u-bahn yellow */
        --bg:     light-dark(oklch(0.965 0.003 255), oklch(0.2 0.006 255));
        --text:   light-dark(oklch(0.4 0.01 255),   oklch(0.78 0.01 255));
        --bright: light-dark(oklch(0.18 0.01 255),  oklch(0.96 0.004 255));
        --muted:  light-dark(oklch(0.5 0.01 255),   oklch(0.65 0.01 255));
        --line:   light-dark(oklch(0.87 0.005 255), oklch(0.32 0.008 255));
        --yellow: oklch(0.89 0.17 97);
        --hover:  light-dark(oklch(0.62 0.15 85), oklch(0.89 0.17 97));
        --ink:    oklch(0.18 0.01 255);

        --pad: clamp(1.25rem, 4vw, 2.5rem);
      }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"]  { color-scheme: dark; }

      html { -webkit-text-size-adjust: 100%; }

      body {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding:
          max(var(--pad), env(safe-area-inset-top))
          max(var(--pad), env(safe-area-inset-right))
          max(var(--pad), env(safe-area-inset-bottom))
          max(var(--pad), env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 400;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      ::selection { background: var(--yellow); color: var(--ink); }

      :focus-visible {
        outline: 2px solid var(--yellow);
        outline-offset: 3px;
        border-radius: 2px;
      }
    }

    @layer components {
      header, footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem 1.5rem;
      }
      header { justify-content: flex-end; }

      .statement h1 {
        font-size: inherit;
        font-weight: 600;
        letter-spacing: -0.04em;
        color: var(--bright);
        margin-block-end: 0;
      }

      .statement p { color: var(--text); }

      .statement {
        align-self: center;
        max-width: 30ch;
        font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
        font-optical-sizing: auto;
        font-size: clamp(1.625rem, 1.05rem + 2.4vw, 2.5rem);
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: -0.03em;
        color: var(--bright);
        text-wrap: balance;
        transition: opacity 0.9s ease;
        @starting-style { opacity: 0; }

        .rest { color: var(--muted); }
        .rest b { font-weight: 400; color: var(--bright); }
      }

      /* text links with a small arrow; the arrow turns yellow and nudges on hover */
      .link, .theme {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.2rem 0;
        background: none;
        border: 0;
        color: var(--bright);
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .link::after {
        content: "\2197";
        display: inline-block;
        color: var(--muted);
        transition: color 0.15s, translate 0.15s;
      }

      .theme svg {
        width: 0.95em;
        height: 0.95em;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        color: var(--muted);
        transition: color 0.15s, rotate 0.25s ease;
      }

      .link:focus-visible::after, .link:active::after {
        color: var(--hover);
        translate: 2px -2px;
      }
      .theme:focus-visible svg, .theme:active svg {
        color: var(--hover);
        rotate: 25deg;
      }
      @media (hover: hover) {
        .link:hover::after { color: var(--hover); translate: 2px -2px; }
        .theme:hover svg { color: var(--hover); rotate: 25deg; }
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1.5rem;
      }

      .clock {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-height: 1.6em;
      }
    }

    /* theme switch: circular reveal from the button via View Transitions */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) { z-index: 2; }

    /* phones: keep the single row, just scale it so all five links fit */
    @media (max-width: 30rem) {
      footer { flex-direction: column; align-items: stretch; gap: 0.25rem; }
      .links {
        width: 100%;
        flex-wrap: nowrap;
        justify-content: space-between;
        gap: 0 0.5rem;
      }
      .link { gap: 0.25rem; font-size: 0.6875rem; padding-block: 0.7rem; }
    }

    @media (pointer: coarse) {
      .theme { min-height: 2.75rem; padding-inline: 0.5rem; margin-inline-end: -0.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .statement { transition: none; }
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <button class="theme" id="theme" type="button"></button>
  </header>

  <main class="statement" id="main">
    <h1>furkan bozdağ</h1>
    <p>
      software crafter, coffee addict and part-time gamer.
      <span class="rest">building at <b>delivery hero</b> in berlin, germany.</span>
    </p>
  </main>

  <footer>
    <p class="clock" id="clock"></p>
    <nav class="links" aria-label="links">
      <a class="link" href="https://linkedin.com/in/bozd4g" target="_blank" rel="me noopener">linkedin</a>
      <a class="link" href="https://github.com/bozd4g" target="_blank" rel="me noopener">github</a>
      <a class="link" href="https://x.com/bozd4g" target="_blank" rel="me noopener">x</a>
      <a class="link" href="https://instagram.com/bozd4g" target="_blank" rel="me noopener">instagram</a>
      <a class="link" href="mailto:me@furkanbozdag.com">email</a>
    </nav>
  </footer>

  <script>
    const root = document.documentElement;
    const btn = document.getElementById('theme');
    const clock = document.getElementById('clock');
    const system = matchMedia('(prefers-color-scheme: dark)');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

    const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : system.matches;

    const icon = (paths) =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
    const SUN = icon('<circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1.5 12h2M20.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>');
    const MOON = icon('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');

    const THEME_COLORS = { dark: '#1c1d20', light: '#f6f6f7' };
    function syncThemeColor() {
      if (!root.dataset.theme) return;
      document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
        m.removeAttribute('media');
        m.content = THEME_COLORS[root.dataset.theme];
      });
    }

    function render() {
      syncThemeColor();
      const dark = isDark();
      btn.innerHTML = `${dark ? 'light' : 'dark'}${dark ? SUN : MOON}`;
      btn.setAttribute('aria-label', `switch to ${dark ? 'light' : 'dark'} theme`);
    }

    function setTheme(theme) {
      root.dataset.theme = theme;
      try { localStorage.setItem('theme', theme); } catch {}
      render();
    }

    btn.addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';

      if (!document.startViewTransition || reduceMotion.matches) {
        setTheme(next);
        return;
      }

      const { left, top, width, height } = btn.getBoundingClientRect();
      const x = left + width / 2;
      const y = top + height / 2;
      const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));

      document.startViewTransition(() => setTheme(next)).ready.then(() => {
        root.animate(
          { clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
          { duration: 500, easing: 'ease-out', pseudoElement: '::view-transition-new(root)' }
        );
      });
    });

    system.addEventListener('change', render);
    addEventListener('storage', (e) => {
      if (e.key !== 'theme') return;
      if (e.newValue === 'light' || e.newValue === 'dark') root.dataset.theme = e.newValue;
      else delete root.dataset.theme;
      render();
    });
    render();

    // live local time in berlin, updated on the minute
    const fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short'
    });
    (function tick() {
      clock.textContent = `berlin ${fmt.format(new Date())}`;
      setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
    })();
  </script>
</body>
